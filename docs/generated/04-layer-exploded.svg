    <ns0:tspan dy="0" x="70">同じ場所を4枚に分解すると、どれが上下か分かる</ns0:tspan>
  </ns0:text>
  <ns0:text fill="#475569" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="21" font-weight="500" text-anchor="start" x="70" y="105">
