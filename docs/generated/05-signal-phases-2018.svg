    <ns0:tspan dy="0" x="185">県道45号の線路下本線を5段階で止める図ではなく、地上の三ツ境下草柳線と中原街道側道を分けて処理する検討案です。</ns0:tspan>
  </ns0:text>
  <ns0:text fill="#475569" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="18" font-weight="500" text-anchor="start" x="185" y="878">
