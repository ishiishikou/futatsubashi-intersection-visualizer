<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" data-status="withdrawn">
  <title>旧信号模式図を撤回しました</title>
  <rect width="1200" height="600" fill="#f8fafc" />
  <text x="50" y="85" font-size="38" font-family="Noto Sans CJK JP, sans-serif" fill="#9a3412">旧信号模式図を撤回しました</text>
  <text x="50" y="157" font-size="26" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a">原資料にない斜め横断と、不整合のある車両矢印を削除。</text>
  <text x="50" y="229" font-size="26" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a">2018年資料の5群は docs/movement-review.md の表を参照。</text>
  <text x="50" y="301" font-size="26" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a">2026年の最終現示・秒数・灯器位置は未確定です。</text>
  <text x="50" y="373" font-size="26" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a">道路構造・通行案内として旧図を使用しないでください。</text>
</svg>