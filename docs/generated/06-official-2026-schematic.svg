  </ns0:text>
  <ns0:text fill="#0f172a" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="20" font-weight="600" text-anchor="start" x="155" y="914">
    <ns0:tspan dy="0" x="155">県道45号のアンダーパスを新しい大交差点に作り替えるのではなく、地上で既存道路と新設道路を交通島まわりに接続し、横断歩道・信号を追加する計画です。</ns0:tspan>
  </ns0:text>
  <ns0:text fill="#475569" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="18" font-weight="500" text-anchor="start" x="155" y="954">
    <ns0:tspan dy="0" x="155">2018年資料には5段階の信号パターン検討案がありますが、2026年の最終的な車両信号現示・秒数までは今回の公開資料から断定していません。</ns0:tspan>
  </ns0:text>
  <ns0:text fill="#475569" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="18" font-weight="500" text-anchor="end" x="1545" y="1024">
    <ns0:tspan dy="0" x="1545">Sources: 横浜市 工事説明会資料（2026-08-06/08）・OpenStreetMap current geometry</ns0:tspan>
  </ns0:text>
