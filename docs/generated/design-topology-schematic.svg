<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" data-status="design-study" data-figure-class="design-study">
  <title>理想形の接続トポロジー（設計検討・私案）</title>
  <rect width="1200" height="950" fill="#f8fafc" />
  <text x="50" y="52" font-size="34" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="start" font-weight="bold">理想形の接続トポロジー（設計検討・私案）</text>
  <text x="50" y="90" font-size="22" font-family="Noto Sans CJK JP, sans-serif" fill="#9a3412" text-anchor="start" font-weight="bold">Muse の設計検討（私案）／公式計画ではありません／配置は模式化したもの</text>
  <rect x="545" y="130" width="110" height="250" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
  <rect x="545" y="500" width="110" height="212" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
  <rect x="60" y="412" width="1080" height="56" fill="#dbeafe" stroke="none" />
  <rect x="60" y="396" width="250" height="88" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" />
  <text x="185" y="434" font-size="22" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="bold">新設道路</text>
  <text x="185" y="464" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="middle">三ツ境下草柳線</text>
  <rect x="890" y="396" width="250" height="88" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" />
  <text x="1015" y="434" font-size="22" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="bold">駅側既存道路</text>
  <text x="1015" y="464" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="middle">三ツ境駅方面</text>
  <text x="600" y="168" font-size="22" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="bold">西側側道</text>
  <text x="600" y="196" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="middle">中原街道（地上）</text>
  <text x="600" y="648" font-size="22" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="bold">東側側道</text>
  <text x="600" y="676" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="middle">中原街道（地上）</text>
  <line x1="330" y1="440" x2="870" y2="440" stroke="#1d4ed8" stroke-width="6" />
  <polygon points="870,440 846,428 846,452" fill="#1d4ed8" />
  <polygon points="330,440 354,428 354,452" fill="#1d4ed8" />
  <text x="430" y="350" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#1d4ed8" text-anchor="middle" font-weight="bold">主軸：直進・左折（群1）</text>
  <path d="M 700 412 Q 700 330 640 300" fill="none" stroke="#ea580c" stroke-width="4" />
  <polygon points="636,296 652,306 630,314" fill="#ea580c" />
  <text x="726" y="322" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#ea580c" text-anchor="start" font-weight="bold">主軸の右折：専用現示（群2）</text>
  <line x1="585" y1="250" x2="585" y2="372" stroke="#64748b" stroke-width="4" />
  <polygon points="585,376 575,354 595,354" fill="#64748b" />
  <line x1="630" y1="508" x2="630" y2="620" stroke="#64748b" stroke-width="4" />
  <polygon points="630,624 620,602 640,602" fill="#64748b" />
  <text x="676" y="268" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="start" font-weight="bold">側道：同時現示（群3）が私案</text>
  <text x="676" y="300" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="start">交錯する場合は西・東に分離</text>
  <circle cx="420" cy="440" r="13" fill="#15803d" />
  <text x="420" y="447" font-size="18" font-family="Noto Sans CJK JP, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="bold">歩</text>
  <circle cx="780" cy="440" r="13" fill="#15803d" />
  <text x="780" y="447" font-size="18" font-family="Noto Sans CJK JP, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="bold">歩</text>
  <circle cx="600" cy="330" r="13" fill="#15803d" />
  <text x="600" y="337" font-size="18" font-family="Noto Sans CJK JP, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="bold">歩</text>
  <circle cx="600" cy="545" r="13" fill="#15803d" />
  <text x="600" y="552" font-size="18" font-family="Noto Sans CJK JP, sans-serif" fill="#ffffff" text-anchor="middle" font-weight="bold">歩</text>
  <text x="676" y="560" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#15803d" text-anchor="start" font-weight="bold">横断歩道：全脚設置＋歩行者群（群4）</text>
  <rect x="460" y="380" width="280" height="120" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <text x="600" y="428" font-size="26" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="bold">1号交差点</text>
  <text x="600" y="462" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="middle">交通島：誘導＋歩行者待避</text>
  <text x="600" y="488" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="middle">信号交差点（私案）</text>
  <rect x="60" y="748" width="1080" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="8 6" />
  <text x="84" y="788" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="start" font-weight="bold">中原街道本線（地下アンダーパス）</text>
  <text x="1116" y="788" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#b91c1c" text-anchor="end" font-weight="bold">この交差点とは接続しない</text>
  <rect x="60" y="824" width="1080" height="56" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2" stroke-dasharray="8 6" />
  <text x="84" y="860" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#0f172a" text-anchor="start" font-weight="bold">歩行者地下通路</text>
  <text x="1116" y="860" font-size="21" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="end">地上横断の補助（階段のみ）</text>
  <text x="50" y="922" font-size="20" font-family="Noto Sans CJK JP, sans-serif" fill="#475569" text-anchor="start">右左折の可否・現示構成は私案であり、実際の交通規制・信号計画は未確定です。</text>
</svg>