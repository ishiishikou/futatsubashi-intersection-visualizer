name: Evidence integrity and audit rendering
on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 fonts-noto-cjk
          pip install -r requirements.txt
      - name: Check evidence and regression cases
        run: |
          python scripts/validate_evidence.py
          python -m unittest discover -s tests -v
      - name: Render and inspect notices
        run: |
          python scripts/build_audit.py
          python scripts/inspect_svg.py docs/generated/*.svg
          python scripts/validate_evidence.py --check-generated
          git diff --exit-code -- docs/generated/*.svg docs/generated/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: partial-audit-review-not-completed-reconstruction
          path: docs/generated/
