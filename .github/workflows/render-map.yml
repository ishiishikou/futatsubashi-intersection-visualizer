name: Render OSM structure

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - config.json
      - requirements.txt
      - 'scripts/**'
      - '.github/workflows/render-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native rendering dependencies and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 fonts-noto-cjk >/dev/null
          fc-cache -f

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build SVG and PNG previews from public OSM data
        run: python scripts/build_map.py

      - name: Inspect SVG structure
        run: |
          python scripts/inspect_svg.py \
            docs/generated/01-current-osm.svg \
            docs/generated/02-grade-separation.svg

      - name: Verify output files
        run: |
          test -s docs/generated/01-current-osm.svg
          test -s docs/generated/01-current-osm.png
          test -s docs/generated/02-grade-separation.svg
          test -s docs/generated/02-grade-separation.png
          test -s docs/generated/metadata.json
          test -s docs/generated/index.html

      - name: Upload rendered review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-map-review
          path: docs/generated/
          retention-days: 7

      - name: Commit deterministic previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/
          git diff --cached --quiet && exit 0
          git commit -m "Render current OSM structure [skip ci]"
          git push
